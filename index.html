<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameAnalytics - Holographic Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0ff;
            overflow: hidden;
            cursor: none;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #videoElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;
            filter: blur(2px) contrast(1.2);
        }

        #canvasElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #threeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .corner-frame {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid #0ff;
            opacity: 0.6;
        }

        .corner-frame.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-frame.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-frame.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-frame.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to bottom, transparent, #0ff, transparent);
            animation: scan 4s linear infinite;
            opacity: 0.3;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(0, 255, 255, 0.03) 49px, rgba(0, 255, 255, 0.03) 50px),
                repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(0, 255, 255, 0.03) 49px, rgba(0, 255, 255, 0.03) 50px);
        }

        #header {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }

        #header h1 {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }

        #header .subtitle {
            font-size: 14px;
            opacity: 0.7;
            letter-spacing: 4px;
        }

        .status-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 60px;
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 30px;
            z-index: 20;
            pointer-events: none;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #0f0;
            box-shadow: 0 0 10px #0f0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .file-card {
            position: absolute;
            background: rgba(0, 10, 20, 0.95);
            border: 2px solid #0ff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.1);
            padding: 20px;
            min-width: 400px;
            max-width: 600px;
            z-index: 15;
            transition: all 0.3s ease;
        }

        .file-card.active {
            border-color: #0f0;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.6), inset 0 0 20px rgba(0, 255, 0, 0.1);
        }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #0ff;
        }

        .file-title {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #0ff;
        }

        .file-close {
            cursor: pointer;
            font-size: 20px;
            pointer-events: all;
            padding: 5px 10px;
            transition: all 0.2s;
        }

        .file-close:hover {
            color: #f00;
            text-shadow: 0 0 10px #f00;
        }

        .chart-container {
            margin-top: 15px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .data-label {
            opacity: 0.7;
        }

        .data-value {
            font-weight: bold;
            text-shadow: 0 0 5px #0ff;
        }

        #cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 2px solid #0ff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transition: all 0.1s ease;
            box-shadow: 0 0 20px #0ff, inset 0 0 10px #0ff;
        }

        #cursor::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #0ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #0ff;
        }

        #cursor.grabbing {
            border-color: #0f0;
            box-shadow: 0 0 30px #0f0, inset 0 0 15px #0f0;
        }

        #cursor.grabbing::before {
            background: #0f0;
            box-shadow: 0 0 15px #0f0;
        }

        .gesture-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 20px #0f0;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .timeline-controls {
            position: absolute;
            top: 120px;
            right: 30px;
            width: 300px;
            background: rgba(0, 10, 20, 0.9);
            border: 1px solid #0ff;
            padding: 20px;
            z-index: 20;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .timeline-year {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #0ff;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(0, 255, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #0ff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px #0ff;
        }

        .mini-chart {
            width: 100%;
            height: 200px;
            margin-top: 15px;
        }

        .file-menu {
            position: absolute;
            left: 30px;
            top: 120px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 20;
        }

        .menu-button {
            padding: 15px 25px;
            background: rgba(0, 10, 20, 0.9);
            border: 2px solid #0ff;
            color: #0ff;
            cursor: pointer;
            pointer-events: all;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
            text-shadow: 0 0 5px #0ff;
            letter-spacing: 2px;
        }

        .menu-button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transform: translateX(5px);
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #0ff;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 10s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-20px) translateX(10px); }
            50% { transform: translateY(-40px) translateX(-10px); }
            75% { transform: translateY(-20px) translateX(5px); }
        }

        #initScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 30px;
        }

        #initScreen h2 {
            font-size: 48px;
            text-shadow: 0 0 20px #0ff;
        }

        #initScreen button {
            padding: 20px 50px;
            font-size: 20px;
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }

        #initScreen button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        .loading {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            opacity: 0.7;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div id="initScreen">
        <h2>GAMEANALYTICS HOLOGRAPHIC INTERFACE</h2>
        <button id="startBtn">INICIALIZAR SISTEMA</button>
        <div class="loading" id="loading" style="display: none;">Cargando detección de manos</div>
    </div>

    <div id="container" style="display: none;">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="canvasElement"></canvas>
        <canvas id="threeCanvas"></canvas>
        
        <div class="hud">
            <div class="corner-frame tl"></div>
            <div class="corner-frame tr"></div>
            <div class="corner-frame bl"></div>
            <div class="corner-frame br"></div>
            <div class="scanline"></div>
            <div class="grid-overlay"></div>
        </div>

        <div class="particles" id="particles"></div>

        <div id="header">
            <h1>GAMEANALYTICS</h1>
            <div class="subtitle">HOLOGRAPHIC DATA VISUALIZATION SYSTEM</div>
        </div>

        <div class="file-menu">
            <button class="menu-button" onclick="openFile('trends')">📊 TENDENCIAS</button>
            <button class="menu-button" onclick="openFile('evolution')">📈 EVOLUCIÓN</button>
            <button class="menu-button" onclick="openFile('metrics')">🎯 MÉTRICAS</button>
            <button class="menu-button" onclick="openFile('comparison')">⚖️ COMPARATIVA</button>
            <button class="menu-button" onclick="openFile('periods')">⏱️ PERÍODOS</button>
            <button class="menu-button" onclick="openFile('predictions')">🔮 PREDICCIONES</button>
        </div>

        <div class="timeline-controls">
            <div class="timeline-year" id="currentYear">2025</div>
            <input type="range" id="timelineSlider" min="0" max="25" value="25" step="1">
            <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px;">
                <span>2000</span>
                <span>2025</span>
            </div>
            <div style="margin-top: 20px; font-size: 12px; opacity: 0.7;">
                <div class="data-row">
                    <span>AAA:</span>
                    <span id="yearAAA">65</span>
                </div>
                <div class="data-row">
                    <span>AA:</span>
                    <span id="yearAA">68</span>
                </div>
                <div class="data-row">
                    <span>INDIE:</span>
                    <span id="yearIndie">90</span>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span id="statusText">SISTEMA ACTIVO</span>
            </div>
            <div class="status-item">
                <span>GESTO: <span id="gestureStatus">NINGUNO</span></span>
            </div>
            <div class="status-item">
                <span>ARCHIVOS: <span id="fileCount">0</span></span>
            </div>
            <div class="status-item">
                <span>FPS: <span id="fps">60</span></span>
            </div>
        </div>

        <div id="cursor"></div>
        <div class="gesture-indicator" id="gestureIndicator"></div>
    </div>

    <script>
        const DATA = {
            years: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025],
            aaa: [88, 87, 86, 85, 84, 83, 82, 82, 81, 80, 79, 78, 77, 76, 75, 74, 73, 72, 71, 71, 70, 69, 68, 67, 66, 65],
            aa: [35, 36, 38, 39, 41, 42, 44, 45, 47, 48, 50, 52, 54, 56, 58, 60, 62, 64, 76, 75, 74, 73, 72, 70, 69, 68],
            indie: [15, 18, 21, 24, 27, 30, 33, 36, 39, 42, 45, 48, 51, 54, 57, 60, 63, 66, 69, 72, 75, 78, 81, 84, 87, 90],
            events: {
                2000: "Modelo retail dominante",
                2004: "Crisis 'EA Spouse'",
                2008: "Boom indie (Braid, Minecraft)",
                2012: "Microtransacciones emergentes",
                2017: "Crisis loot boxes",
                2020: "Indie supera AAA",
                2023: "Despidos masivos",
                2025: "Fragmentación total"
            }
        };

        let hands, camera;
        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;
        let isGrabbing = false;
        let openFiles = [];
        let currentYear = 25;
        let selectedFile = null;
        let draggedFile = null;
        let dragOffset = { x: 0, y: 0 };

        // Particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // Initialize system
        document.getElementById('startBtn').onclick = async function() {
            document.getElementById('loading').style.display = 'block';
            this.disabled = true;
            
            try {
                await initCamera();
                await initHands();
                document.getElementById('initScreen').style.display = 'none';
                document.getElementById('container').style.display = 'block';
                createParticles();
                initTimeline();
                updateFPS();
            } catch (error) {
                alert('Error al inicializar: ' + error.message);
                this.disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        };

        async function initCamera() {
            const video = document.getElementById('videoElement');
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 1280, height: 720 }
            });
            video.srcObject = stream;
            return new Promise(resolve => {
                video.onloadedmetadata = () => resolve();
            });
        }

        async function initHands() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            const video = document.getElementById('videoElement');
            camera = new Camera(video, {
                onFrame: async () => {
                    await hands.send({ image: video });
                },
                width: 1280,
                height: 720
            });
            camera.start();
        }

        function onResults(results) {
            const canvas = document.getElementById('canvasElement');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawHand(ctx, landmarks);
                    
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];
                    
                    cursorX = indexTip.x * canvas.width;
                    cursorY = indexTip.y * canvas.height;
                    
                    const distance = Math.sqrt(
                        Math.pow(indexTip.x - thumbTip.x, 2) + 
                        Math.pow(indexTip.y - thumbTip.y, 2)
                    );
                    
                    const wasGrabbing = isGrabbing;
                    isGrabbing = distance < 0.05;
                    
                    if (isGrabbing && !wasGrabbing) {
                        onGrab();
                    } else if (!isGrabbing && wasGrabbing) {
                        onRelease();
                    }
                    
                    updateCursor();
                    document.getElementById('gestureStatus').textContent = isGrabbing ? 'AGARRANDO' : 'APUNTANDO';
                }
            }
            
            ctx.restore();
        }

        function drawHand(ctx, landmarks) {
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#0ff';
            ctx.shadowBlur = 10;

            const connections = [
                [0,1],[1,2],[2,3],[3,4],
                [0,5],[5,6],[6,7],[7,8],
                [0,9],[9,10],[10,11],[11,12],
                [0,13],[13,14],[14,15],[15,16],
                [0,17],[17,18],[18,19],[19,20]
            ];

            for (const [start, end] of connections) {
                const startPoint = landmarks[start];
                const endPoint = landmarks[end];
                ctx.beginPath();
                ctx.moveTo(startPoint.x * ctx.canvas.width, startPoint.y * ctx.canvas.height);
                ctx.lineTo(endPoint.x * ctx.canvas.width, endPoint.y * ctx.canvas.height);
                ctx.stroke();
            }

            for (const landmark of landmarks) {
                ctx.fillStyle = '#0ff';
                ctx.beginPath();
                ctx.arc(
                    landmark.x * ctx.canvas.width,
                    landmark.y * ctx.canvas.height,
                    5, 0, 2 * Math.PI
                );
                ctx.fill();
            }
        }

        function updateCursor() {
            const cursor = document.getElementById('cursor');
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            cursor.className = isGrabbing ? 'grabbing' : '';
        }

        function onGrab() {
            const hitFile = getFileAtPosition(cursorX, cursorY);
            if (hitFile) {
                selectedFile = hitFile;
                draggedFile = hitFile;
                const rect = hitFile.getBoundingClientRect();
                dragOffset.x = cursorX - rect.left;
                dragOffset.y = cursorY - rect.top;
                hitFile.classList.add('active');
            }
        }

        function onRelease() {
            if (selectedFile) {
                selectedFile.classList.remove('active');
                selectedFile = null;
            }
            draggedFile = null;
        }

        function getFileAtPosition(x, y) {
            const files = document.querySelectorAll('.file-card');
            for (let i = files.length - 1; i >= 0; i--) {
                const rect = files[i].getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    return files[i];
                }
            }
            return null;
        }

        setInterval(() => {
            if (draggedFile && isGrabbing) {
                draggedFile.style.left = (cursorX - dragOffset.x) + 'px';
                draggedFile.style.top = (cursorY - dragOffset.y) + 'px';
            }
        }, 16);

        function openFile(type) {
            if (openFiles.includes(type)) return;
            
            const card = document.createElement('div');
            card.className = 'file-card';
            card.id = 'file-' + type;
            card.style.left = (100 + openFiles.length * 50) + 'px';
            card.style.top = (200 + openFiles.length * 40) + 'px';
            
            let content = '';
            
            switch(type) {
                case 'trends':
                    content = `
                        <div class="file-header">
                            <div class="file-title">📊 ANÁLISIS DE TENDENCIAS</div>
                            <div class="file-close" onclick="closeFile('${type}')">✕</div>
                        </div>
                        <canvas id="trendChart" width="550" height="300"></canvas>
                    `;
                    break;
                case 'evolution':
                    content = `
                        <div class="file-header">
                            <div class="file-title">📈 EVOLUCIÓN TEMPORAL</div>
                            <div class="file-close" onclick="closeFile('${type}')">✕</div>
                        </div>
                        <div class="data-row">
                            <span class="data-label">DECLIVE AAA</span>
                            <span class="data-value">-26%</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">ASCENSO INDIE</span>
                            <span class="data-value">+500%</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">CRECIMIENTO AA</span>
                            <span class="data-value">+94%</span>
                        </div>
                        <canvas id="evolutionChart" width="550" height="200"></canvas>
                    `;
                    break;
                case 'metrics':
                    content = `
                        <div class="file-header">
                            <div class="file-title">🎯 MÉTRICAS ACTUALES</div>
                            <div class="file-close" onclick="closeFile('${type}')">✕</div>
                        </div>
                        <div class="data-row">
                            <span class="data-label">NOTA MEDIA AAA</span>
                            <span class="data-value">${DATA.aaa[currentYear]}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">NOTA MEDIA AA</span>
                            <span class="data-value">${DATA.aa[currentYear]}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">NOTA MEDIA INDIE</span>
                            <span class="data-value">${DATA.indie[currentYear]}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">JUEGOS ANALIZADOS</span>
                            <span class="data-value">156</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">EVENTOS CLAVE</span>
                            <span class="data-value">23</span>
                        </div>
                    `;
                    break;
                case 'comparison':
                    content = `
                        <div class="file-header">
                            <div class="file-title">⚖️ COMPARATIVA</div>
                            <div class="file-close" onclick="closeFile('${type}')">✕</div>
                        </div>
                        <canvas id="comparisonChart" width="550" height="250"></canvas>
                    `;
                    break;
                case 'periods':
                    content = `
                        <div class="file-header">
                            <div class="file-title">⏱️ PERÍODOS HISTÓRICOS</div>
                            <div class="file-close" onclick="closeFile('${type}')">✕</div>
                        </div>
                        <div style="font-size: 14px; line-height: 1.8;">
                            <div style="margin-bottom: 15px;">
                                <div style="font-weight: bold; color: #0f0;">2000-2008: ERA DE EXPANSIÓN</div>
                                <div style="opacity: 0.8;">AAA domina con modelo retail</div>
                            </div>
                            <div style="margin-bottom: 15px;">
                                <div style="font-weight: bold; color: #0f0;">2008-2015: REVOLUCIÓN DIGITAL</div>
                                <div style="opacity: 0.8;">Boom indie y crisis económica</div>
                            </div>
                            <div style="margin-bottom: 15px;">
                                <div style="font-weight: bold; color: #0f0;">2015-2025: FRAGMENTACIÓN</div>
                                <div style="opacity: 0.8;">Indie lidera calidad crítica</div>
                            </div>
                        </div>
                    `;
                    break;
                case 'predictions':
                    content = `
                        <div class="file-header">
                            <div class="file-title">🔮 PREDICCIONES 2030</div>
                            <div class="file-close" onclick="closeFile('${type}')">✕</div>
                        </div>
                        <div class="data-row">
                            <span class="data-label">AAA PROYECTADO</span>
                            <span class="data-value">60.59</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">AA PROYECTADO</span>
                            <span class="data-value">85.2</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">INDIE PROYECTADO</span>
                            <span class="data-value">100</span>
                        </div>
                        <div style="margin-top: 20px; font-size: 12px; opacity: 0.8; line-height: 1.6;">
                            El análisis predictivo sugiere la consolidación definitiva del segmento indie como líder en calidad, mientras el AAA enfrenta una crisis existencial.
                        </div>
                    `;
                    break;
            }
            
            card.innerHTML = content;
            document.getElementById('container').appendChild(card);
            openFiles.push(type);
            updateFileCount();
            
            setTimeout(() => {
                if (type === 'trends') drawTrendChart();
                if (type === 'evolution') drawEvolutionChart();
                if (type === 'comparison') drawComparisonChart();
            }, 100);
        }

        function closeFile(type) {
            const card = document.getElementById('file-' + type);
            if (card) {
                card.remove();
                openFiles = openFiles.filter(f => f !== type);
                updateFileCount();
            }
        }

        function updateFileCount() {
            document.getElementById('fileCount').textContent = openFiles.length;
        }

        function drawTrendChart() {
            const canvas = document.getElementById('trendChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0, 20, 40, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const padding = 50;
            const width = canvas.width - padding * 2;
            const height = canvas.height - padding * 2;
            
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = padding + (height / 5) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(canvas.width - padding, y);
                ctx.stroke();
                
                ctx.fillStyle = '#0ff';
                ctx.font = '10px Courier New';
                ctx.fillText((100 - i * 20).toString(), 10, y + 5);
            }
            
            drawLine(ctx, DATA.aaa, '#f00', padding, width, height);
            drawLine(ctx, DATA.aa, '#ff0', padding, width, height);
            drawLine(ctx, DATA.indie, '#0f0', padding, width, height);
            
            ctx.fillStyle = '#f00';
            ctx.fillRect(canvas.width - 150, 20, 15, 15);
            ctx.fillStyle = '#0ff';
            ctx.font = '12px Courier New';
            ctx.fillText('AAA', canvas.width - 130, 32);
            
            ctx.fillStyle = '#ff0';
            ctx.fillRect(canvas.width - 150, 45, 15, 15);
            ctx.fillStyle = '#0ff';
            ctx.fillText('AA', canvas.width - 130, 57);
            
            ctx.fillStyle = '#0f0';
            ctx.fillRect(canvas.width - 150, 70, 15, 15);
            ctx.fillStyle = '#0ff';
            ctx.fillText('INDIE', canvas.width - 130, 82);
        }

        function drawLine(ctx, data, color, padding, width, height) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            
            for (let i = 0; i < data.length; i++) {
                const x = padding + (width / (data.length - 1)) * i;
                const y = padding + height - (data[i] / 100) * height;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function drawEvolutionChart() {
            const canvas = document.getElementById('evolutionChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0, 20, 40, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const barWidth = 150;
            const gap = 25;
            const startX = 50;
            
            const values = [
                { label: 'AAA', value: ((88 - 65) / 88 * 100), color: '#f00' },
                { label: 'INDIE', value: ((90 - 15) / 15 * 100), color: '#0f0' },
                { label: 'AA', value: ((68 - 35) / 35 * 100), color: '#ff0' }
            ];
            
            values.forEach((item, i) => {
                const x = startX + i * (barWidth + gap);
                const barHeight = (item.value / 500) * 150;
                
                ctx.fillStyle = item.color;
                ctx.shadowColor = item.color;
                ctx.shadowBlur = 15;
                ctx.fillRect(x, 150 - barHeight, barWidth, barHeight);
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#0ff';
                ctx.font = '12px Courier New';
                ctx.fillText(item.label, x + barWidth/2 - 20, 175);
                ctx.fillText(item.value.toFixed(0) + '%', x + barWidth/2 - 20, 190);
            });
        }

        function drawComparisonChart() {
            const canvas = document.getElementById('comparisonChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0, 20, 40, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const years = [2000, 2010, 2020, 2025];
            const barWidth = 30;
            const groupGap = 80;
            
            years.forEach((year, i) => {
                const yearIndex = DATA.years.indexOf(year);
                const x = 50 + i * groupGap;
                
                drawBar(ctx, x, DATA.aaa[yearIndex], '#f00');
                drawBar(ctx, x + barWidth + 5, DATA.aa[yearIndex], '#ff0');
                drawBar(ctx, x + (barWidth + 5) * 2, DATA.indie[yearIndex], '#0f0');
                
                ctx.fillStyle = '#0ff';
                ctx.font = '10px Courier New';
                ctx.fillText(year.toString(), x + 25, 230);
            });
        }

        function drawBar(ctx, x, value, color) {
            const maxHeight = 180;
            const barHeight = (value / 100) * maxHeight;
            
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.fillRect(x, 210 - barHeight, 30, barHeight);
            ctx.shadowBlur = 0;
        }

        function initTimeline() {
            const slider = document.getElementById('timelineSlider');
            slider.oninput = function() {
                currentYear = parseInt(this.value);
                updateTimeline();
            };
            updateTimeline();
        }

        function updateTimeline() {
            document.getElementById('currentYear').textContent = DATA.years[currentYear];
            document.getElementById('yearAAA').textContent = DATA.aaa[currentYear];
            document.getElementById('yearAA').textContent = DATA.aa[currentYear];
            document.getElementById('yearIndie').textContent = DATA.indie[currentYear];
        }

        let lastTime = performance.now();
        let frames = 0;
        function updateFPS() {
            frames++;
            const now = performance.now();
            if (now >= lastTime + 1000) {
                document.getElementById('fps').textContent = frames;
                frames = 0;
                lastTime = now;
            }
            requestAnimationFrame(updateFPS);
        }
    </script>
</body>
</html>
